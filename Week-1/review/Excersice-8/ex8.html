<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excersice-8</title>
    <style>
        .container {
            height: 100%;
            width: 100%;
            background-color: brown;
            
        }
        .box {
            height: 60px;
            width: 60px;
            background-color: rgb(115, 103, 103);
            border-radius:70px;
            position: absolute;
            bottom:0;
            left:0;
            animation: shalonieX 3s linear infinite,shalonieY  1s ease-out infinite alternate;

            


        }
        @keyframes shalonieX  {
            form{
             bottom:0;
            }
           to{
             bottom: 100%;
           } 
        }
           @keyframes shalonieY  {
            form{
             bottom:0;
            }
           to{
             bottom: 100%;
           } 
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>

</html>
