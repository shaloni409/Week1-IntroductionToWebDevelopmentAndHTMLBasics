<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectors</title>
    <style>
        /* Universal  selectors*/
        *{
            margin-inline-start: 20px;
        }
        /* Element Seslector*/
        div>p{
            background-color: rgb(255, 0, 230);
        }
        /*Class selectors*/
        .red{
            background-color: rgb(175, 26, 26);
        }
        /* ID Selector*/
        #box{
            color: rgb(50, 26, 147);
        }
        /* Psuedo Selector*/
        a:visited{
            color: brown;
        }

    </style>
</head>
<body>
    <div>
        i am shaloni mishra.
    </div>
    <h1 class="red">I am very profeciant in my work I do any thing</h1>
    <div id="box">
        <article>
        I love my teacher
        <p> I love my family and I do anything for them</p>
        </article>
    </div>
    <a href="https://translate.google.co.in/">got to google translator</a>
  
</body>
</html>
